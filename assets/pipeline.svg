<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="235" viewBox="0 0 1200 235" role="img" aria-label="Read, plan, extract, verify, evolve. A traceable knowledge loop.">
<title>Read, plan, extract, verify, evolve. A traceable knowledge loop.</title>
<defs>
  <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#244039" stroke-width=".6" opacity=".45"/></pattern>
  <radialGradient id="halo"><stop stop-color="#285a43" stop-opacity=".55"/><stop offset="1" stop-color="#0b1514" stop-opacity="0"/></radialGradient>
</defs>
<style>
 .mono {font-family:'Cascadia Code',Consolas,'Liberation Mono',monospace;}
 .serif {font-family:Georgia,'Times New Roman',serif;}
 .sans {font-family:Arial,'Microsoft YaHei',sans-serif;}
 .flow {stroke-dasharray:7 12;animation:flow 8s linear infinite;}
 .pulse {animation:pulse 4s ease-in-out infinite;}
 @keyframes flow {to {stroke-dashoffset:-190;}}
 @keyframes pulse {0%,100% {opacity:.35;} 50% {opacity:1;}}
 @media(prefers-reduced-motion:reduce) {.flow,.pulse {animation:none;}}
</style>
<rect width="1200" height="235" rx="16" fill="#101c19"/><rect x="1" y="1" width="1198" height="233" rx="15" fill="none" stroke="#294239"/>
