<text x="520" y="99" fill="#6d9671" font-size="11" class="mono">03</text>
<text x="520" y="126" fill="#b2f178" font-size="19" letter-spacing="1" class="mono">EXTRACT</text>
<text x="520" y="150" fill="#a4b8ab" font-size="11" class="mono">Structured records</text><rect x="739" y="73" width="192" height="99" rx="8" fill="#0b1514" stroke="#38563f"/>
<text x="755" y="99" fill="#6d9671" font-size="11" class="mono">04</text>
