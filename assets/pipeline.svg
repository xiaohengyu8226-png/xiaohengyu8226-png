<text x="1165" y="39" text-anchor="end" fill="#6c8a78" font-size="11" class="mono">A TRACEABLE KNOWLEDGE LOOP</text>
<path d="M135 108H1065" fill="none" stroke="#b2f178" stroke-width="1.5" class="flow"/><rect x="34" y="73" width="192" height="99" rx="8" fill="#0b1514" stroke="#38563f"/>
<text x="50" y="99" fill="#6d9671" font-size="11" class="mono">01</text>
