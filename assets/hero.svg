<style>
 .mono {font-family:'Cascadia Code',Consolas,'Liberation Mono',monospace;}
 .serif {font-family:Georgia,'Times New Roman',serif;}
 .sans {font-family:Arial,'Microsoft YaHei',sans-serif;}
 .flow {stroke-dasharray:7 12;animation:flow 8s linear infinite;}
 .pulse {animation:pulse 4s ease-in-out infinite;}
 @keyframes flow {to {stroke-dashoffset:-190;}}
 @keyframes pulse {0%,100% {opacity:.35;} 50% {opacity:1;}}
 @media(prefers-reduced-motion:reduce) {.flow,.pulse {animation:none;}}
</style>

