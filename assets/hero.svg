<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-label="Hengyu personal lab. Knowledge, in motion. LLM algorithms, multimodal learning, RAG and medical AI.">
<title>Hengyu personal lab. Knowledge, in motion. LLM algorithms, multimodal learning, RAG and medical AI.</title>
<defs>
